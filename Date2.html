<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quick Question 💞</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      background: radial-gradient(circle at center, #ffe0f0, #ffb6c1, #ff9eb5);
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }
    .container {
      text-align: center;
      animation: fadeIn 2s ease;
      background: rgba(255, 255, 255, 0.2);
      padding: 60px;
      border-radius: 30px;
      box-shadow: 0 0 40px rgba(255,255,255,0.3);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 2;
    }
    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 3rem;
      color: white;
      text-shadow: 0 0 15px rgba(255,255,255,0.7);
      animation: slideDown 1.5s ease;
      margin-bottom: 30px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn {
      background: linear-gradient(135deg, #ff7fa1, #ff3f81);
      color: white;
      font-size: 1.4rem;
      padding: 15px 40px;
      border: none;
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255,63,129,0.4);
      margin: 15px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.3);
      transition: 0.5s;
    }
    .btn:hover::before { left: 100%; }
    .btn:hover { transform: scale(1.08); }

    /* Floating hearts */
    .heart {
      position: absolute;
      bottom: -10px;
      font-size: 20px;
      color: #fff;
      animation: floatUp 6s linear infinite;
      opacity: 0.7;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }

    /* Pop-up message */
    .message {
  position: fixed;                  /* ensures it sits above everything */
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: rgba(255, 255, 255, 0.9);
  padding: 40px 60px;
  border-radius: 25px;
  color: #ff2f7d;
  font-size: 2rem;
  opacity: 0;
  animation: showMsg 0.8s ease forwards;
  box-shadow: 0 0 30px rgba(255, 118, 168, 0.6);
  text-shadow: 0 0 8px rgba(255, 60, 120, 0.5);
  z-index: 9999;                    /* ✅ makes sure it's on top */
}

    @keyframes showMsg {
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dear Princess, Would you like to go on a date with me today? 💖</h1>
    <div>
      <button class="btn" id="yesBtn">Yes 💞</button>
      <button class="btn" id="noBtn">No 💔</button>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');

    // Floating hearts animation
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '💗';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (15 + Math.random() * 25) + 'px';
      heart.style.animationDuration = (4 + Math.random() * 4) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }
    setInterval(createHeart, 400);

    // Moving No button
    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
      noBtn.style.position = 'absolute';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    });

    // Yes button exciting messages
    const messages = [
      "Yayyy!! Thank you darlingg 💘",
      "You'r just greattt! 💕",
      "Can't wait to see you 😍",
      "You're officially my favorite person today 💞"
    ];

    yesBtn.addEventListener('click', () => {
      const msg = document.createElement('div');
      msg.classList.add('message');
      msg.innerText = messages[Math.floor(Math.random() * messages.length)];
      document.body.appendChild(msg);
      setTimeout(() => msg.remove(), 3000);
    });
  </script>
</body>
</html>
